server:
  port: 8080

spring:
  application:
    name: directorio-cristiano-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/directorio_cristiano
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

management:
  health:
    mail:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:defaultSecretKeyThatMustBeChangedInProductionAtLeast256BitsLong}
    expiration-ms: 900000
    refresh-expiration-ms: 604800000

  gemini:
    api-key: ${GEMINI_API_KEY:}
    api-url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent

  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    demo-mode-enabled: ${GOOGLE_DEMO_MODE:true}

  # Moderadores del directorio (correos separados por coma). Ver specs/002, research R8.
  moderators:
    emails: ${APP_MODERATOR_EMAILS:}

  # Avisos por correo de moderación. Sin SMTP, los avisos van al log (research R7).
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.directoriocristiano: DEBUG
    org.springframework.security: INFO
    org.hibernate.orm.jdbc.bind: TRACE
